name: Build APK and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools
            unzip -q /tmp/cmdtools.zip -d /tmp
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Pack HTML into the WebView
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("game.js").read_text(encoding="utf-8")
          html = html.replace('<script src="game.js"></script>', "<script>\n" + js + "\n</script>")
          out = Path("android/app/src/main/assets/www")
          out.mkdir(parents=True, exist_ok=True)
          (out / "index.html").write_text(html, encoding="utf-8")
          print("packed", (out / "index.html").stat().st_size, "bytes")
          PY

      - name: Release keystore
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f dosiren-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore dosiren-release.keystore \
              -alias dosiren \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dosirenfan2026 -keypass dosirenfan2026 \
              -dname "CN=Do Siren Fan, OU=LuntikVisuals, O=Fan Tribute, L=Columbus, ST=Ohio, C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" /tmp/do-siren-1.0.0.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "release already exists"
          else
            cat > /tmp/notes.md << 'NOTES'
          До сирен 1.0.0 — первая ночь

          Короткая вертикальная игра вид сверху. Клён-Хилл, Огайо: дом с двором и особняк.
          Ты и 4 бота. Роль случайная — выживший или киллер.
          Киллер ночи: Джейсон Вурхиз, Майкл Майерс или Крик, у каждого своя способность.
          Цель живых — дождаться полиции. Щитки ускоряют сирены.

          Это фан-трибьют. Все права на персонажей принадлежат их законным владельцам.
          applicationId com.luntikvisuals.dosiren, versionCode 1, versionName 1.0.0.
          Android 7.0+. Ставится как отдельное приложение. Подпись релиза сохраняется в репозитории, чтобы следующие версии вставали поверх.
          NOTES
            sed -i 's/^          //' /tmp/notes.md
            gh release create v1.0.0 /tmp/do-siren-1.0.0.apk \
              --target main --latest \
              --title "До сирен v1.0.0" \
              --notes-file /tmp/notes.md
          fi

      - name: Keep the signing key for the next build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- android/dosiren-release.keystore)" ]; then
            git add android/dosiren-release.keystore
            git commit -m "Store release keystore for future updates"
            git push origin HEAD:main
          fi
