plugins {
    id "com.android.application"
}

android {
    namespace "com.luntikvisuals.dosiren"
    compileSdk 34

    defaultConfig {
        applicationId "com.luntikvisuals.dosiren"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/dosiren-release.keystore")
            storePassword "dosirenfan2026"
            keyAlias "dosiren"
            keyPassword "dosirenfan2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
